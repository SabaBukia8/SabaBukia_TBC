syntax = "proto3";

option java_package = "com.example.sababukia_tbc";
option java_multiple_files = true;

message AppPreferences {
  string registered_username = 1;
  string registered_email = 2;
  string auth_token = 3;
  bool remember_me = 4;
  string fcm_token = 5;
  string pending_deep_link = 6;
}
